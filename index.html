<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW iDrive: Project Lemon & Berry</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        /* --- M-SERIES DASH MINI-GAME OVERLAY --- */
        #startup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #121212;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            touch-action: none; /* Prevents mobile pull-to-refresh while steering */
        }
        .btn-skip {
            position: absolute;
            bottom: 30px;
            background: rgba(227, 38, 54, 0.8);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 10;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* --- HEADER & GLOBALS --- */
        .header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
            border-bottom: 2px solid #0066b1; /* BMW Blue */
            padding-bottom: 10px;
        }
        .header h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; font-size: 24px;}
        .subtitle { font-size: 12px; color: #888; margin-top: 0; }

        /* --- OPTOMETRIST EYE CHART --- */
        .bmw-widget {
            background-color: #1a1a1a;
            border-top: 3px solid #e32636; /* BMW Red */
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .bmw-widget h3 { margin-top: 0; color: #ccc; font-size: 12px; letter-spacing: 1px;}
        .snellen-chart {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 6px;
            filter: blur(5px);
            transition: filter 2s ease-in-out;
            margin: 15px 0;
        }
        .clear-vision { filter: blur(0px); }
        .row-1 { font-size: 40px; }
        .row-2 { font-size: 30px; }
        .row-3 { font-size: 22px; }
        .row-4 { font-size: 16px; }
        .row-5 { font-size: 12px; color: #ffeb3b; letter-spacing: 2px; margin-top: 5px;}
        
        .btn-calibrate {
            padding: 8px 16px;
            background-color: #0066b1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
        }

        /* --- 2-COLUMN GRID GALLERY --- */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-bottom: 40px;
        }
        .flip-card {
            background-color: transparent;
            width: 100%;
            aspect-ratio: 3 / 4; /* Perfect portrait ratio, less cropping */
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .flip-card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #0066b1, #121212, #e32636);
            padding: 10px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .flip-card-back p {
            font-size: 14px;
            font-weight: 400;
            color: white;
            line-height: 1.4;
            margin: 0;
        }
        .media-item {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        
        /* Smaller flip button for the 2-column layout */
        .btn-flip {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            font-size: 14px;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- M-SERIES DASH MINI-GAME OVERLAY -->
    <div id="startup-overlay">
        <canvas id="gameCanvas"></canvas>
        <button class="btn-skip" onclick="unlockDashboard()">Skip to Gift ⏩</button>
    </div>

    <div class="header">
        <h1>iDRIVE: V 1.0</h1>
        <p class="subtitle">Driver: Lemon 🍋 | Passenger: Berry 🍓</p>
    </div>

    <!-- Eye Chart -->
    <div class="bmw-widget">
        <h3>Vision Diagnostics</h3>
        <div id="eyeChart" class="snellen-chart">
            <div class="row-1">1</div>
            <div class="row-2">M O</div>
            <div class="row-3">N T H</div>
            <div class="row-4">I L O V E</div>
            <div class="row-5">Y O U B E R R Y</div>
        </div>
        <button class="btn-calibrate" onclick="document.getElementById('eyeChart').classList.add('clear-vision')">
            Calibrate Vision
        </button>
    </div>

    <!-- 2-Column Gallery -->
    <div class="gallery-container" id="photoGallery"></div>

    <script>
        // --- GAME LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameActive = true;
        let score = 0;
        let items = [];
        let laneOffset = 0;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let carX = canvas.width / 2;

        // Mobile touch steering
        canvas.addEventListener('touchmove', (e) => { carX = e.touches[0].clientX; });
        // Desktop mouse steering
        canvas.addEventListener('mousemove', (e) => { carX = e.clientX; });

        function spawnItem() {
            if(!gameActive) return;
            items.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: -50,
                type: Math.random() > 0.5 ? '🍓' : '🍋',
                speed: (canvas.height / 150) + Math.random() * 2 // Dynamic falling speed
            });
            setTimeout(spawnItem, 600); // Spawns a new item every 0.6s
        }
        setTimeout(spawnItem, 500);

        function drawGame() {
            if(!gameActive) return;
            
            // Draw Asphalt
            ctx.fillStyle = '#121212';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Moving Road Lines
            ctx.lineWidth = 4;
            ctx.setLineDash([30, 30]);
            laneOffset += 6;
            if(laneOffset > 60) laneOffset = 0;
            ctx.lineDashOffset = -laneOffset;
            
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 3, 0); ctx.lineTo(canvas.width / 3, canvas.height);
            ctx.moveTo((canvas.width / 3) * 2, 0); ctx.lineTo((canvas.width / 3) * 2, canvas.height);
            ctx.stroke();

            // Handle Falling Berries & Lemons
            ctx.font = "35px Arial";
            let carY = canvas.height - 120;
            
            for(let i = 0; i < items.length; i++) {
                let item = items[i];
                item.y += item.speed;
                ctx.fillText(item.type, item.x - 17, item.y + 17);
                
                // Collision Detection
                if(Math.abs(item.x - carX) < 45 && Math.abs(item.y - carY) < 45) {
                    score++;
                    items.splice(i, 1);
                    i--;
                    
                    if(score >= 10) {
                        unlockDashboard();
                        return;
                    }
                } else if (item.y > canvas.height + 50) {
                    items.splice(i, 1);
                    i--;
                }
            }
            
            // Draw Player Car Emoji
            ctx.font = "50px Arial";
            ctx.fillText("🏎️", carX - 25, carY + 25);
            
            // Draw UI (Score Bar)
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(20, 40, canvas.width - 40, 15);
            ctx.fillStyle = '#0066b1';
            ctx.fillRect(20, 40, (score / 10) * (canvas.width - 40), 15);
            
            ctx.fillStyle = 'white';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("Catch 10 🍓 or 🍋 to unlock!", canvas.width / 2, 80);
            ctx.textAlign = 'left';

            requestAnimationFrame(drawGame);
        }
        drawGame();

        function unlockDashboard() {
            gameActive = false;
            let overlay = document.getElementById('startup-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 1000);
        }

        // --- EXPANDED UNIQUE MESSAGES ---
        const sweetMessages = [
            "Happy 1 month, bubba! 🍓",
            "You're the Berry to my Lemon. 🍋",
            "Every day is better with my girl.",
            "I love you, babygirl.",
            "My favorite view right here.",
            "One month down, a lifetime to go.",
            "20/20 vision, and I still only see you. 👓",
            "You drive me crazy (in the best way). 🏎️",
            "Best month ever with you, bubba.",
            "You have my heart, babygirl.",
            "Can't take my eyes off you.",
            "My absolute favorite passenger.",
            "The cutest optometrist in the world.",
            "Every mile with you is my favorite.",
            "You make my engine race! 💨",
            "Forever your Lemon 🍋",
            "Just the beginning of us.",
            "You make everything brighter.",
            "My favorite person to annoy.",
            "Still falling for you every day."
        ];

        // --- GALLERY BUILDER ---
        const gallery = document.getElementById('photoGallery');
        const totalItems = 175;
        let messageCounter = 0; // The rolling counter to prevent duplicates

        for (let i = 1; i <= totalItems; i++) {
            
            // 1. Build Image Card
            let msg1 = sweetMessages[messageCounter % sweetMessages.length];
            messageCounter++; 
            let imgCard = createFlipCard('img', `images/Berry (${i}).jpg`, msg1);
            gallery.appendChild(imgCard);

            // 2. Build Video Card
            let msg2 = sweetMessages[messageCounter % sweetMessages.length];
            messageCounter++; 
            let vidCard = createFlipCard('video', `images/Berry (${i}).mp4`, msg2);
            gallery.appendChild(vidCard);
        }

        function createFlipCard(type, src, message) {
            let card = document.createElement('div');
            card.className = 'flip-card';
            
            let inner = document.createElement('div');
            inner.className = 'flip-card-inner';
            
            let front = document.createElement('div');
            front.className = 'flip-card-front';
            
            let back = document.createElement('div');
            back.className = 'flip-card-back';
            // Tapping the message flips it back to the picture
            back.onclick = () => card.classList.remove('flipped');
            back.innerHTML = `<p>${message}</p>`;
            
            // Floating ↺ button so it doesn't block the picture
            let flipBtn = document.createElement('button');
            flipBtn.className = 'btn-flip';
            flipBtn.innerHTML = '↺';
            flipBtn.onclick = (e) => {
                e.stopPropagation(); 
                card.classList.add('flipped');
            };
            front.appendChild(flipBtn);

            let media;
            if (type === 'img') {
                media = document.createElement('img');
                media.className = 'media-item';
                media.loading = 'lazy';
            } else {
                media = document.createElement('video');
                media.className = 'media-item';
                media.controls = true;
                media.muted = true;
            }
            media.src = src;
            
            media.onerror = function() { card.remove(); };
            
            front.appendChild(media);
            inner.appendChild(front);
            inner.appendChild(back);
            card.appendChild(inner);
            
            return card;
        }
    </script>
</body>
</html>
