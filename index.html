<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW iDrive: Project Lemon & Berry</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        /* --- M-SERIES DASH MINI-GAME OVERLAY --- */
        #startup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #121212;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .btn-skip {
            position: absolute;
            bottom: 40px;
            background: rgba(227, 38, 54, 0.9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            z-index: 10;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- HEADER & GLOBALS --- */
        .header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
            border-bottom: 2px solid #0066b1;
            padding-bottom: 10px;
        }
        .header h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; font-size: 24px;}
        .subtitle { font-size: 12px; color: #888; margin-top: 0; }

        /* --- MASSIVE OPTOMETRIST EYE CHART --- */
        .bmw-widget {
            background-color: #1a1a1a;
            border-top: 3px solid #e32636;
            border-radius: 12px;
            padding: 20px 10px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .bmw-widget h3 { margin-top: 0; color: #ccc; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;}
        .snellen-chart {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 10px;
            filter: blur(6px);
            transition: filter 2.5s ease-in-out;
            margin: 25px 0;
        }
        .clear-vision { filter: blur(0px); }
        
        /* Greatly increased font sizes */
        .row-1 { font-size: 65px; margin-bottom: 10px; }
        .row-2 { font-size: 50px; margin-bottom: 10px; }
        .row-3 { font-size: 38px; margin-bottom: 10px; }
        .row-4 { font-size: 26px; margin-bottom: 10px; }
        .row-5 { font-size: 18px; color: #ffeb3b; letter-spacing: 3px; margin-top: 15px;}
        
        .btn-calibrate {
            padding: 12px 24px;
            background-color: #0066b1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            font-weight: bold;
        }

        /* --- 2-COLUMN GRID GALLERY --- */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-bottom: 40px;
        }
        .flip-card {
            background-color: transparent;
            width: 100%;
            aspect-ratio: 3 / 4;
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Images are now clickable anywhere */
        .clickable-image {
            cursor: pointer;
        }

        .flip-card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #0066b1, #121212, #e32636);
            padding: 15px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .flip-card-back p {
            font-size: 14px;
            font-weight: 400;
            color: white;
            line-height: 1.5;
            margin: 0;
        }
        .media-item {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        
        /* Dedicated flip button for videos only */
        .btn-flip-video {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 102, 177, 0.9);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 10;
            font-size: 12px;
            backdrop-filter: blur(4px);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- M-SERIES DASH MINI-GAME -->
    <div id="startup-overlay">
        <canvas id="gameCanvas"></canvas>
        <button class="btn-skip" onclick="unlockDashboard()">Skip to Gift ⏩</button>
    </div>

    <div class="header">
        <h1>iDRIVE: V 1.0</h1>
        <p class="subtitle">Driver: Lemon 🍋 | Passenger: Berry 🍓</p>
    </div>

    <!-- Massive Eye Chart -->
    <div class="bmw-widget">
        <h3>Vision Diagnostics</h3>
        <div id="eyeChart" class="snellen-chart">
            <div class="row-1">1</div>
            <div class="row-2">M O</div>
            <div class="row-3">N T H</div>
            <div class="row-4">I L O V E</div>
            <div class="row-5">Y O U B E R R Y</div>
        </div>
        <br>
        <button class="btn-calibrate" onclick="document.getElementById('eyeChart').classList.add('clear-vision')">
            Calibrate Vision
        </button>
    </div>

    <!-- Gallery -->
    <div class="gallery-container" id="photoGallery"></div>

    <script>
        // --- GAME LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameActive = true;
        let score = 0;
        let items = [];
        let laneOffset = 0;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let carX = canvas.width / 2;

        canvas.addEventListener('touchmove', (e) => { carX = e.touches[0].clientX; });
        canvas.addEventListener('mousemove', (e) => { carX = e.clientX; });

        function spawnItem() {
            if(!gameActive) return;
            items.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: -50,
                type: Math.random() > 0.5 ? '🍓' : '🍋',
                speed: (canvas.height / 150) + Math.random() * 2
            });
            setTimeout(spawnItem, 600);
        }
        setTimeout(spawnItem, 500);

        function drawGame() {
            if(!gameActive) return;
            
            ctx.fillStyle = '#121212';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.lineWidth = 4;
            ctx.setLineDash([30, 30]);
            laneOffset += 6;
            if(laneOffset > 60) laneOffset = 0;
            ctx.lineDashOffset = -laneOffset;
            
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 3, 0); ctx.lineTo(canvas.width / 3, canvas.height);
            ctx.moveTo((canvas.width / 3) * 2, 0); ctx.lineTo((canvas.width / 3) * 2, canvas.height);
            ctx.stroke();

            ctx.font = "35px Arial";
            let carY = canvas.height - 120;
            
            for(let i = 0; i < items.length; i++) {
                let item = items[i];
                item.y += item.speed;
                ctx.fillText(item.type, item.x - 17, item.y + 17);
                
                if(Math.abs(item.x - carX) < 45 && Math.abs(item.y - carY) < 45) {
                    score++;
                    items.splice(i, 1);
                    i--;
                    
                    if(score >= 10) {
                        unlockDashboard();
                        return;
                    }
                } else if (item.y > canvas.height + 50) {
                    items.splice(i, 1);
                    i--;
                }
            }
            
            ctx.font = "50px Arial";
            ctx.fillText("🏎️", carX - 25, carY + 25);
            
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(20, 60, canvas.width - 40, 15);
            ctx.fillStyle = '#0066b1';
            ctx.fillRect(20, 60, (score / 10) * (canvas.width - 40), 15);
            
            ctx.fillStyle = 'white';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("Catch 10 🍓 or 🍋 to unlock!", canvas.width / 2, 105);
            ctx.textAlign = 'left';

            requestAnimationFrame(drawGame);
        }
        drawGame();

        function unlockDashboard() {
            gameActive = false;
            let overlay = document.getElementById('startup-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 1000);
        }

        // --- 2-SENTENCE REASSURANCE & INSIDE JOKE MESSAGES ---
        const sweetMessages = [
            "I know I hurt you when I walked away, but I promise I am never letting you go again. You are my forever, Berry, and I'll spend every day proving that your heart is safe with me.",
            "I am so sorry for making you feel scared and closed off last week. I am here to stay, completely yours, even when I'm blaming my Cloudys on the dog.",
            "Happy one month to the girl who holds my entire heart. I know things got hard, but choosing you is the easiest decision I will ever make.",
            "You are the most beautiful part of my life, and I am so lucky you gave us another chance. I promise to protect your heart as fiercely as I love it.",
            "I know rebuilding trust takes time, and I am ready to put in all the work for you. Just please don't make me sleep on the couch the next time a massive Cloudy slips out.",
            "Leaving was the biggest mistake I've ever made, and I will spend my life making it up to you. You are my safe place, my best friend, and my only love.",
            "Every time I look at you, I am reminded of exactly why I came back. We are meant to be together, through every high, every low, and every terrible Cloudy.",
            "I understand why you feel guarded right now, but I am not going anywhere ever again. You are the only future I want, my beautiful Berry.",
            "You are the strongest, most incredible woman I know, and I hate that I made you doubt us. I love you with everything I have, and I'm staying right here by your side.",
            "One month is just the beginning of our story, and I promise the next chapters will be filled with so much love. I am so deeply in love with you, and I will never take you for granted again.",
            "I want to be the reason you feel safe, loved, and completely secure. Even if my Cloudys threaten to ruin the romantic mood, my heart is always entirely yours.",
            "Thank you for being brave enough to let me back in. I will spend every single day showing you that your trust is completely secure with me.",
            "When we stopped speaking for those three days, my whole world went completely dark. You are my light, my love, and my forever passenger.",
            "I know words aren't enough right now, so I will show you with my actions every single day. You are my one and only, and I am never walking away from this.",
            "I love you more than I could ever possibly explain. You can trust me to hold you close, keep you safe, and warn you before a Cloudy hits.",
            "My biggest fear is ever losing you again. I am so hopelessly in love with you, and I am here for the long haul.",
            "You are my soulmate, my best friend, and the girl of my absolute dreams. I am so sorry for the tears, and I promise to bring you nothing but happiness from now on.",
            "No rough patch will ever be stronger than the love I have for you. I am yours completely, through every stormy day and every single Cloudy.",
            "I know you're scared, but please know that my heart belongs entirely to you. I will patiently wait for your walls to come down, because you are worth everything to me.",
            "Happy one month to my beautiful optometrist. I see my whole future in your eyes, and I am never letting it fade."
        ];

        // --- GALLERY BUILDER (VIDEOS FIRST, THEN IMAGES) ---
        const gallery = document.getElementById('photoGallery');
        const totalItems = 175;
        let messageCounter = 0; 

        // Loop 1: Load all Videos first
        for (let i = 1; i <= totalItems; i++) {
            let msg = sweetMessages[messageCounter % sweetMessages.length];
            messageCounter++; 
            let vidCard = createFlipCard('video', `images/Berry (${i}).mp4`, msg);
            gallery.appendChild(vidCard);
        }

        // Loop 2: Load all Images underneath
        for (let i = 1; i <= totalItems; i++) {
            let msg = sweetMessages[messageCounter % sweetMessages.length];
            messageCounter++; 
            let imgCard = createFlipCard('img', `images/Berry (${i}).jpg`, msg);
            gallery.appendChild(imgCard);
        }

        function createFlipCard(type, src, message) {
            let card = document.createElement('div');
            card.className = 'flip-card';
            
            let inner = document.createElement('div');
            inner.className = 'flip-card-inner';
            
            let front = document.createElement('div');
            front.className = 'flip-card-front';
            
            let back = document.createElement('div');
            back.className = 'flip-card-back';
            
            // Tapping the message on the back flips it back to the front
            back.onclick = () => card.classList.remove('flipped');
            back.innerHTML = `<p>${message}</p>`;
            
            let media;
            if (type === 'img') {
                media = document.createElement('img');
                media.className = 'media-item';
                media.loading = 'lazy';
                
                // For images: Clicking ANYWHERE on the front flips it
                front.classList.add('clickable-image');
                front.onclick = () => card.classList.add('flipped');
                
            } else {
                media = document.createElement('video');
                media.className = 'media-item';
                media.controls = true;
                media.muted = true;
                
                // For videos: We must use a separate button, otherwise clicking to play/pause the video flips the card instead
                let flipBtn = document.createElement('button');
                flipBtn.className = 'btn-flip-video';
                flipBtn.innerHTML = 'Read Message ↺';
                flipBtn.onclick = (e) => {
                    e.stopPropagation(); 
                    card.classList.add('flipped');
                };
                front.appendChild(flipBtn);
            }
            
            media.src = src;
            
            // Instantly delete the card if the file type doesn't exist for this number
            media.onerror = function() { card.remove(); };
            
            front.appendChild(media);
            inner.appendChild(front);
            inner.appendChild(back);
            card.appendChild(inner);
            
            return card;
        }
    </script>
</body>
</html>
